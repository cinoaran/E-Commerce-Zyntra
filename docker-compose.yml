services:
  postgres:
    image: postgres:16-alpine
    container_name: postgres
    ports:
      - "5432:5432"
    environment:
      - POSTGRES_USER=zyntra
      - POSTGRES_PASSWORD=zyntra
      - POSTGRES_DB=zyntra_db
    volumes:
      - postgres_zyntra_data:/var/lib/postgresql/data
volumes:
  postgres_zyntra_data: